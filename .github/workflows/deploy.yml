name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!.github/**'
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/dwi-wahyu/ppid-sulsel-frontend:latest
          build-args: |
            API_URL=${{ secrets.API_URL }}
            BACKEND_URL=${{ secrets.BACKEND_URL }}
            PUBLIC_API_URL=${{ secrets.PUBLIC_API_URL }}
            PUBLIC_BACKEND_URL=${{ secrets.PUBLIC_BACKEND_URL }}
            ACCESS_TOKEN_MAX_AGE=${{ secrets.ACCESS_TOKEN_MAX_AGE }}
            REFRESH_TOKEN_MAX_AGE=${{ secrets.REFRESH_TOKEN_MAX_AGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/ppid-sulselprov

            # Login ke GHCR untuk pull image private
            echo "${{ secrets.GHCR_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull image terbaru
            podman pull ghcr.io/dwi-wahyu/ppid-sulsel-frontend:latest

            # Restart pod
            # Pastikan ppid-app.yaml di server sudah diperbarui manual sekali 
            # untuk menggunakan image ghcr.io dan mountPath /app/.env
            podman kube down ppid-app.yaml || true
            podman kube play ppid-app.yaml
